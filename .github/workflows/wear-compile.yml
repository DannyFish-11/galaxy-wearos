name: Wear Compile Gate

# Wear OS 之前【没有任何 CI】,编译从未被验证过 —— 这是它长期编译不过却没人拦的根因。
# 本门只做一件事:把 :app 的 debug Kotlin 编译起来。因 settings.gradle.kts 依赖兄弟仓
# ../ufo-galaxy-android 的 :shared-transport / :shared-protocol,CI 必须同时检出两仓、
# 摆成兄弟目录再编译。
#
# 需要所有者做一次:添加仓库 Secret **GALAXY_CROSS_REPO_TOKEN**(一个能读
# DannyFish-11/ufo-galaxy-android 的 PAT 或 fine-grained token)——默认 GITHUB_TOKEN
# 只能访问当前仓,拿不到私有兄弟仓。加上后本门即可真正编译验证。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    # 与兄弟仓 android-ci 同教训:不设 timeout 的 job 挂起时会占住 runner 数小时。
    timeout-minutes: 25
    steps:
      - name: Checkout galaxy-wearos
        uses: actions/checkout@v4
        with:
          path: galaxy-wearos

      # 兄弟仓此前被【硬钉在 main】。后果不是"偶尔不方便"，而是**任何跨仓改动都不可能
      # 在单个 PR 里变绿**：手表侧引用安卓分支上的新类必然 Unresolved reference，只能
      # 先合安卓、再回来重跑。相位色收敛与 mDNS 收敛两轮都撞过同一堵墙。
      #
      # 改成：PR 上先找兄弟仓里【同名分支】，没有才回落 main；push（含 main）永远用 main。
      # 后半句是这条的前提 —— 主干必须始终对着主干验证，否则"main 是绿的"不再成立。
      #
      # 安全边界：ls-remote 只在 **DannyFish-11/ufo-galaxy-android** 里找分支，而那个仓
      # 只有所有者能推。分叉 PR 起任意分支名也命中不了不存在的分支，拿不到额外代码。
      - name: 解析兄弟仓要 checkout 的 ref
        id: sibling
        env:
          SIBLING_REPO: DannyFish-11/ufo-galaxy-android
          CROSS_REPO_TOKEN: ${{ secrets.GALAXY_CROSS_REPO_TOKEN || github.token }}
          PR_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || '' }}
        run: |
          set -euo pipefail
          DEFAULT_REF=main
          REF="$DEFAULT_REF"
          if [ -n "$PR_BRANCH" ] && [ "$PR_BRANCH" != "$DEFAULT_REF" ]; then
            # 不回显 URL：里面带 token。ls-remote 失败(网络/权限)也按 main 处理，
            # 宁可回到旧行为，也不要因为探测本身把整条门弄红。
            if git ls-remote --exit-code --heads \
                 "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/${SIBLING_REPO}.git" \
                 "refs/heads/${PR_BRANCH}" >/dev/null 2>&1; then
              REF="$PR_BRANCH"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "兄弟仓 ${SIBLING_REPO} 将 checkout: $REF"
          if [ "$REF" = "$DEFAULT_REF" ]; then
            echo "✅ 兄弟仓用 \`main\`，本次构建与主干一致。" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ 本次构建用的是兄弟仓的分支，不是 \`main\`"
              echo
              echo "- 兄弟仓：\`${SIBLING_REPO}\`"
              echo "- 使用的 ref：\`${REF}\`（PR 同名分支）"
              echo
              echo "**合并顺序有要求**：这条绿只证明「两个分支放在一起是好的」，"
              echo "不证明合进 \`main\` 之后也好。必须**先合兄弟仓的对应 PR**，再合本 PR；"
              echo "顺序反了，本仓 \`main\` 会在合并那一刻变红。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout sibling ufo-galaxy-android (shared-transport / shared-protocol)
        uses: actions/checkout@v4
        with:
          repository: DannyFish-11/ufo-galaxy-android
          ref: ${{ steps.sibling.outputs.ref }}
          path: ufo-galaxy-android
          token: ${{ secrets.GALAXY_CROSS_REPO_TOKEN || github.token }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('galaxy-wearos/**/*.gradle*', 'galaxy-wearos/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build debug + run unit tests (:app)
        working-directory: galaxy-wearos
        # 从"只编 main Kotlin"扩到"整包 assembleDebug + 编译单测源集",把资源/清单/打包/
        # 测试代码这些窄门看不见的错误也一并拦下(所有者要求:完整排错、全部跑通、修到零错)。
        # 不加 --stacktrace:Kotlin 的 e: file 编译错照常打印,不被上百行 Gradle 栈淹没。
        #
        # 升级:testDebugUnitTest 取代 compileDebugUnitTestKotlin——兄弟仓 android 的教训:
        # "测试只编译、从不运行"的门放过了上百处真实失败(含多个真生产 bug)。
        # 测试必须真跑,红了就修,不留只编不跑的假绿。
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wear-unit-test-results
          path: galaxy-wearos/app/build/reports/tests/
